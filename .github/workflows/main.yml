name: Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install poetry
        run: pipx install poetry

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'poetry'
      
      - name: Run Pytest
        run: |
          poetry install
          cd tests
          poetry run pytest -s
      
      - name: Build
        run: |
            poetry run pyinstaller main.spec --clean --noconfirm --distpath .
            mkdir output\resource
            xcopy src\resource output\resource /s /e /v /q /y
      
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: OnmyojiDesktopAssistant
          path: output/
