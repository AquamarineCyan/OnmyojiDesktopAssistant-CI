[project]
name = "OnmyojiDesktopAssistant"
version = "2.0.13"
description = "适配网易阴阳师桌面版的辅助程序"
authors = ["AquamarineCyan <1057424730@qq.com>"]
readme = "README.md"
repository = "https://github.com/AquamarineCyan/OnmyojiDesktopAssistant"
packages = [{include = "src"}]
requires-python = ">=3.11"
dependencies = [
    "chardet<7",
    "httpx>=0.28.1",
    "numpy==2.2.6",
    "opencv-python==4.12.0.88",
    "paddleocr==3.4.0",
    "paddlepaddle==3.2.0",
    "pillow==11.3.0",
    "pyautogui>=0.9.54",
    "pydantic>=2.13.4",
    "pynput>=1.8.2",
    "pyside6==6.10.1",
    "pyside6-fluent-widgets>=1.11.2",
    "pywin32>=311",
    "pyyaml==6.0.2",
    "win11toast>=0.36.3",
    "winshell>=0.6",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pytest>=9.0.3",
]

[tool.ruff]
line-length = 120
